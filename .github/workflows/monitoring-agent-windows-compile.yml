name: Monitoring Agent Windows compile and platform tests
on:
  push:
    branches:
      - windows-compile-check-20261124
permissions:
  contents: read
concurrency:
  group: monitoring-agent-windows-compile
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'
jobs:
  cross-compile:
    # Public standard VM only. No paid larger/private runner fallback.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify frozen agent-ci, apply the Windows patch to a temp copy
        shell: bash
        run: |
          set -euo pipefail
          (cd agent-ci && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/w"
          cp -r agent-ci "$RUNNER_TEMP/w/agent-ci"
          (cd "$RUNNER_TEMP/w" && git apply -p1 --check "$GITHUB_WORKSPACE/agent-ci-windows/agent-ci-windows.patch" && git apply -p1 "$GITHUB_WORKSPACE/agent-ci-windows/agent-ci-windows.patch")
      - name: Compile linux/amd64 (regression) and windows/amd64, link only
        working-directory: ${{ runner.temp }}/w/agent-ci
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go list -mod=readonly -tags grpcnotrace -deps . | wc -l
          GOOS=linux GOARCH=amd64 go build -p 1 -mod=readonly -trimpath -tags grpcnotrace -o "$RUNNER_TEMP/linux-COMPILE-ONLY" .
          GOOS=windows GOARCH=amd64 go build -p 1 -mod=readonly -trimpath -tags grpcnotrace -o "$RUNNER_TEMP/windows-COMPILE-ONLY.exe" .
          GOOS=darwin GOARCH=arm64 go build -p 1 -mod=readonly -trimpath -tags grpcnotrace -o "$RUNNER_TEMP/darwin-COMPILE-ONLY" .
          GOOS=windows GOARCH=amd64 go vet -tags grpcnotrace ./...
          printf 'Compile/link/vet only. Binaries NOT executed, not retained.\n' >> "$GITHUB_STEP_SUMMARY"
  windows-platform-tests:
    if: github.event.repository.private == false
    needs: cross-compile
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Apply patch to a temp copy and run only the platform config tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w"
          cp -r agent-ci "$RUNNER_TEMP/w/agent-ci"
          cd "$RUNNER_TEMP/w"
          git apply -p1 "$GITHUB_WORKSPACE/agent-ci-windows/agent-ci-windows.patch"
          cd agent-ci
          go test -p 1 -mod=readonly -trimpath -tags grpcnotrace -run 'TestPlatformDefaults|TestHostScrapers|TestWindowsStateDir' -v .
      # No artifact, cache, release, package, service install or runtime start.
