name: Build checks
# Automated build verification only. This workflow never creates releases, tags, or deployments;
# release.yml (tag-triggered) is the only release path and is not exercised by branch pushes.
# Manual trigger only for now: the account's billing restriction blocks hosted runners on private
# repos, so the repo is temporarily public (user-authorized) to get green builds; push triggers are
# left off to avoid accidental runs while source preservation pushes happen. Re-add push triggers
# when the repo returns private after the account billing/runner restriction is resolved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: agent/manifest.yaml
      # release.sh runs the agent unit tests inside the builder-generated _build module
      # (go test -tags grpcnotrace ./...) before compiling, so tests and the binary are one step.
      - name: Test and build agent
        run: DESTDIR="$RUNNER_TEMP/downloads" bash agent/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/downloads/*
          retention-days: 7
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API server unit tests
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm test
